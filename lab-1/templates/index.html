<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Лабораторная работа: CMYK – RGB – HLS</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 24px;
            color: #333;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
            background: #fff;
            padding: 24px 32px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            margin-top: 0;
            text-align: center;
        }

        .preview-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
            padding: 16px;
            background: #fafafa;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .color-box {
            width: 90px;
            height: 90px;
            border-radius: 10px;
            border: 2px solid #ccc;
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.2);
        }

        .models-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .model-card {
            background: #fdfdfd;
            border: 1px solid #e1e4e8;
            border-radius: 8px;
            padding: 15px;
        }

        .model-card h3 {
            margin-top: 0;
            text-align: center;
            border-bottom: 2px solid #007bff;
            padding-bottom: 6px;
        }

        .control-row {
            margin-bottom: 12px;
        }

        .control-row label {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .inputs {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="range"] {
            flex-grow: 1;
            cursor: pointer;
        }

        input[type="number"] {
            width: 60px;
            padding: 4px 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Исследование цветовых моделей: CMYK – RGB – HLS</h2>

        <!-- Блок палитры и предпросмотра -->
        <div class="preview-bar">
            <label for="colorPicker" style="font-weight: bold;">Выбор из палитры:</label>
            <input type="color" id="colorPicker" value="#3498db"
                style="cursor: pointer; width: 50px; height: 50px; border: none;">
            <div id="colorPreview" class="color-box" style="background-color: #3498db;"></div>
            <span id="hexValue" style="font-family: monospace; font-size: 18px; font-weight: bold;">#3498db</span>
        </div>

        <div class="models-grid">
            <!-- RGB -->
            <div class="model-card">
                <h3>RGB</h3>
                <div class="control-row">
                    <label><span>Red (R):</span><span id="val_r">52</span></label>
                    <div class="inputs">
                        <input type="range" id="slider_r" min="0" max="255" value="52">
                        <input type="number" id="num_r" min="0" max="255" value="52">
                    </div>
                </div>
                <div class="control-row">
                    <label><span>Green (G):</span><span id="val_g">152</span></label>
                    <div class="inputs">
                        <input type="range" id="slider_g" min="0" max="255" value="152">
                        <input type="number" id="num_g" min="0" max="255" value="152">
                    </div>
                </div>
                <div class="control-row">
                    <label><span>Blue (B):</span><span id="val_b">219</span></label>
                    <div class="inputs">
                        <input type="range" id="slider_b" min="0" max="255" value="219">
                        <input type="number" id="num_b" min="0" max="255" value="219">
                    </div>
                </div>
            </div>

            <!-- CMYK -->
            <div class="model-card">
                <h3>CMYK</h3>
                <div class="control-row">
                    <label><span>Cyan (C, %):</span><span id="val_c">76.3</span></label>
                    <div class="inputs">
                        <input type="range" id="slider_c" min="0" max="100" step="0.1" value="76.3">
                        <input type="number" id="num_c" min="0" max="100" step="0.1" value="76.3">
                    </div>
                </div>
                <div class="control-row">
                    <label><span>Magenta (M, %):</span><span id="val_m">30.6</span></label>
                    <div class="inputs">
                        <input type="range" id="slider_m" min="0" max="100" step="0.1" value="30.6">
                        <input type="number" id="num_m" min="0" max="100" step="0.1" value="30.6">
                    </div>
                </div>
                <div class="control-row">
                    <label><span>Yellow (Y, %):</span><span id="val_y">0</span></label>
                    <div class="inputs">
                        <input type="range" id="slider_y" min="0" max="100" step="0.1" value="0">
                        <input type="number" id="num_y" min="0" max="100" step="0.1" value="0">
                    </div>
                </div>
                <div class="control-row">
                    <label><span>Black (K, %):</span><span id="val_k">14.1</span></label>
                    <div class="inputs">
                        <input type="range" id="slider_k" min="0" max="100" step="0.1" value="14.1">
                        <input type="number" id="num_k" min="0" max="100" step="0.1" value="14.1">
                    </div>
                </div>
            </div>

            <!-- HLS -->
            <div class="model-card">
                <h3>HLS</h3>
                <div class="control-row">
                    <label><span>Hue (H, °):</span><span id="val_h">204</span></label>
                    <div class="inputs">
                        <input type="range" id="slider_h" min="0" max="360" step="0.1" value="204">
                        <input type="number" id="num_h" min="0" max="360" step="0.1" value="204">
                    </div>
                </div>
                <div class="control-row">
                    <label><span>Lightness (L, %):</span><span id="val_l">53.1</span></label>
                    <div class="inputs">
                        <input type="range" id="slider_l" min="0" max="100" step="0.1" value="53.1">
                        <input type="number" id="num_l" min="0" max="100" step="0.1" value="53.1">
                    </div>
                </div>
                <div class="control-row">
                    <label><span>Saturation (S, %):</span><span id="val_s">69.9</span></label>
                    <div class="inputs">
                        <input type="range" id="slider_s" min="0" max="100" step="0.1" value="69.9">
                        <input type="number" id="num_s" min="0" max="100" step="0.1" value="69.9">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Функция отправки запроса в Python-бэкенд
        async function updateFromModel(model, values) {
            try {
                const response = await fetch('/convert', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: model, values: values })
                });
                const data = await response.json();
                updateUI(data);
            } catch (err) {
                console.error('Ошибка связи с сервером:', err);
            }
        }

        // Обновление всех элементов UI значениями, полученными из Python
        function updateUI(data) {
            // Предпросмотр и палитра
            document.getElementById('colorPreview').style.backgroundColor = data.hex;
            document.getElementById('hexValue').innerText = data.hex;
            document.getElementById('colorPicker').value = data.hex;

            // RGB
            ['r', 'g', 'b'].forEach(ch => {
                document.getElementById(`slider_${ch}`).value = data.rgb[ch];
                document.getElementById(`num_${ch}`).value = data.rgb[ch];
                document.getElementById(`val_${ch}`).innerText = data.rgb[ch];
            });

            // CMYK
            ['c', 'm', 'y', 'k'].forEach(ch => {
                document.getElementById(`slider_${ch}`).value = data.cmyk[ch];
                document.getElementById(`num_${ch}`).value = data.cmyk[ch];
                document.getElementById(`val_${ch}`).innerText = data.cmyk[ch];
            });

            // HLS
            ['h', 'l', 's'].forEach(ch => {
                document.getElementById(`slider_${ch}`).value = data.hls[ch];
                document.getElementById(`num_${ch}`).value = data.hls[ch];
                document.getElementById(`val_${ch}`).innerText = data.hls[ch];
            });
        }

        // Связывание ползунков и инпутов RGB
        ['r', 'g', 'b'].forEach(ch => {
            const slider = document.getElementById(`slider_${ch}`);
            const num = document.getElementById(`num_${ch}`);
            const handler = (e) => {
                updateFromModel('RGB', {
                    r: document.getElementById('slider_r').value,
                    g: document.getElementById('slider_g').value,
                    b: document.getElementById('slider_b').value
                });
            };
            slider.addEventListener('input', () => { num.value = slider.value; handler(); });
            num.addEventListener('input', () => { slider.value = num.value; handler(); });
        });

        // Связывание ползунков и инпутов CMYK
        ['c', 'm', 'y', 'k'].forEach(ch => {
            const slider = document.getElementById(`slider_${ch}`);
            const num = document.getElementById(`num_${ch}`);
            const handler = () => {
                updateFromModel('CMYK', {
                    c: document.getElementById('slider_c').value,
                    m: document.getElementById('slider_m').value,
                    y: document.getElementById('slider_y').value,
                    k: document.getElementById('slider_k').value
                });
            };
            slider.addEventListener('input', () => { num.value = slider.value; handler(); });
            num.addEventListener('input', () => { slider.value = num.value; handler(); });
        });

        // Связывание ползунков и инпутов HLS
        ['h', 'l', 's'].forEach(ch => {
            const slider = document.getElementById(`slider_${ch}`);
            const num = document.getElementById(`num_${ch}`);
            const handler = () => {
                updateFromModel('HLS', {
                    h: document.getElementById('slider_h').value,
                    l: document.getElementById('slider_l').value,
                    s: document.getElementById('slider_s').value
                });
            };
            slider.addEventListener('input', () => { num.value = slider.value; handler(); });
            num.addEventListener('input', () => { slider.value = num.value; handler(); });
        });

        // Изменение через цветовую палитру (Color Picker)
        document.getElementById('colorPicker').addEventListener('input', (e) => {
            const hex = e.target.value;
            const r = parseInt(hex.substr(1, 2), 16);
            const g = parseInt(hex.substr(3, 2), 16);
            const b = parseInt(hex.substr(5, 2), 16);
            updateFromModel('RGB', { r, g, b });
        });
    </script>

</body>

</html>
